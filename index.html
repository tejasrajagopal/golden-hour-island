<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golden Hour Island</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* The scene is a daylight sky, so both themes share the same palette. */
  :root { --sky-top: #6d93e9; --sky-bottom: #6da5df; --bg: #5f93dd; --text: #ffffff; --loader-bg: #0c39a9; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --sky-top: #6d93e9; --sky-bottom: #6da5df; --bg: #5f93dd; --text: #ffffff; } }
  :root[data-theme="dark"] { --sky-top: #6d93e9; --sky-bottom: #6da5df; --bg: #5f93dd; --text: #ffffff; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); }
  body { font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  canvas { display: block; outline: none; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #hint { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); pointer-events: none;
    font-size: 12px; letter-spacing: .03em; color: rgba(255,255,255,.8); text-shadow: 0 1px 8px rgba(40,70,120,.35);
    transition: opacity 1.2s; white-space: nowrap; }
  #stage { position: fixed; inset: 0; }
  /* loader: the Golden Hour title card, revealed by the shutter transition below */
  #loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 5; background: var(--loader-bg); }
  .loader__mark { display: block; width: clamp(240px, 29.9vw, 560px); height: auto; max-height: 60vh; }
  /* shutter transition (Osmo Supply "Shutter Page Transition"), colour set to the loader blue */
  .transition { z-index: 100; pointer-events: none; position: fixed; inset: 0; overflow: clip; }
  .transition__panel { opacity: 0; flex-flow: column; width: 100%; height: 100%; display: flex; position: absolute; top: 0; left: 0; }
  .transition__shutter { background-color: var(--loader-bg); width: 100%; height: 100%; }
  #soundBtn { position: fixed; top: max(14px, env(safe-area-inset-top)); right: 14px; z-index: 4; display: flex; align-items: center; gap: 7px;
    padding: 7px 13px 7px 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,.4); background: rgba(24,40,70,.28);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); color: var(--text); font: 500 12.5px Inter, system-ui, sans-serif; cursor: pointer; }
  #soundBtn:hover { background: rgba(24,40,70,.42); }
  #soundBtn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  #soundBtn .w { display: none; } #soundBtn[aria-pressed="true"] .w { display: inline; } #soundBtn[aria-pressed="true"] .x { display: none; }
  #err { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; z-index: 6;
    background: #8fb0de; color: #fff; font-size: 15px; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
// -----------------------------------------
// PAGE TRANSITIONS (Osmo Supply "Shutter Page Transition", adapted to this single page:
// the title card is the page that leaves, the 3D scene is the page that enters; no Barba/Lenis needed)
// -----------------------------------------
(() => {
  const shutterAmountConfig = { desktop: 10, tablet: 10, mobileLandscape: 10, mobile: 10 };
  const transitionDuration = 0.5;
  const shutterStaggerAmount = 0.3;
  const MIN_CARD = 1.6;                                   // seconds the title card stays up at least
  const t0 = performance.now();
  const rmMQ = window.matchMedia('(prefers-reduced-motion: reduce)');

  function generateShutters() {
    const panel = document.querySelector('[data-transition-panel]');
    if (!panel) return;
    const width = window.innerWidth, isLandscape = window.innerWidth > window.innerHeight;
    let shutterAmount = shutterAmountConfig.desktop;
    if (width <= 479) shutterAmount = shutterAmountConfig.mobile;
    else if (width <= 767) shutterAmount = isLandscape ? shutterAmountConfig.mobileLandscape : shutterAmountConfig.mobile;
    else if (width <= 991) shutterAmount = shutterAmountConfig.tablet;
    const shutters = panel.querySelectorAll('[data-transition-shutter]');
    if (shutters.length === shutterAmount) return;
    const template = shutters[0];
    if (!template) return;
    const frag = document.createDocumentFragment();
    for (let i = 0; i < shutterAmount; i++) frag.appendChild(template.cloneNode(true));
    panel.replaceChildren(frag);
  }

  function reveal() {
    const current = document.getElementById('loading');
    const next = document.getElementById('stage');
    if (!current || current.dataset.leaving) return;
    current.dataset.leaving = '1';
    if (!window.gsap || rmMQ.matches) { current.remove(); return; }   // no GSAP / reduced motion: immediate swap
    gsap.ticker.lagSmoothing(0);                          // keep real time while the first heavy 3D frames render (as the Osmo boilerplate does)

    generateShutters();
    const transitionPanel = document.querySelector('[data-transition-panel]');
    const allShutters = transitionPanel.querySelectorAll('[data-transition-shutter]');
    const totalCoverDuration = transitionDuration + shutterStaggerAmount;
    const tl = gsap.timeline({ onComplete: () => { gsap.set(transitionPanel, { opacity: 0 }); gsap.set(next, { clearProps: 'transform' }); } });

    // leave: the shutters close over the title card while it drifts up
    tl.set(transitionPanel, { opacity: 1, pointerEvents: 'none' }, 0);
    tl.set(allShutters, { scaleY: 1.02, yPercent: 50, clipPath: 'polygon(0% 100%, 100% 100%, 100% 100%, 0% 100%)' }, 0);
    tl.to(allShutters, {
      duration: transitionDuration, ease: 'power3.in', yPercent: 0,
      clipPath: 'polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)',
      stagger: { amount: shutterStaggerAmount, from: 'end' },
    }, 0);
    tl.fromTo(current.firstElementChild, { y: '0vh' }, { y: '-15vh', ease: 'power3.in', duration: transitionDuration * 1.5 }, 0);

    // enter: once covered, the card goes and the shutters open on the scene, which rises into place
    tl.add('startEnter', totalCoverDuration);
    tl.call(() => current.remove(), null, 'startEnter');
    tl.to(allShutters, {
      duration: transitionDuration * 1.5, ease: 'expo.out',
      clipPath: 'polygon(0% 0%, 100% 0%, 100% -2%, 0% -2%)', yPercent: -50,
      stagger: { amount: shutterStaggerAmount, from: 'end' }, overwrite: 'auto',
    }, 'startEnter');
    tl.from(next, { ease: 'expo.out', y: '20vh', duration: totalCoverDuration }, 'startEnter');
  }

  // called by the scene once its first frames are drawn; waits so the title card is seen
  window.__revealScene = () => {
    const wait = Math.max(0, MIN_CARD * 1000 - (performance.now() - t0));
    setTimeout(reveal, wait);
  };
})();
</script>

function ihash(x, y, z) {

    new THREE.MeshStandardMaterial({ color: 0x1c1c1e, roughness: 0.62 }),
    { colorFreq: 9, colorAmt: 0.22, bumpFreq: 60, strength: 0.18 }));

}

// Sticker maps, generated from the label's own alpha so they fit the artwork exactly:
//  - normal: a soft bevel where the sticker's edge lifts off the glass, plus fine paper/vinyl grain
//  - rough:  print roughness with faint variation (scuffs catch the light differently)
//  - peel:   very gentle "orange peel" ripple of the laminate, so its reflection wobbles like a real sticker
function stickerMaps(src) {
  const S = 2, w = Math.round(src.width / S), h = Math.round(src.height / S);
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const g = cv.getContext('2d'); g.drawImage(src, 0, 0, w, h);
  const A = g.getImageData(0, 0, w, h).data;
  let H = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) H[i] = A[i * 4 + 3] / 255;
  const blur = (F, r) => {                                           // separable box blur
    const T = new Float32Array(w * h), O = new Float32Array(w * h);
    for (let y = 0; y < h; y++) { let acc = 0; for (let x = -r; x <= r; x++) acc += F[y * w + Math.min(w - 1, Math.max(0, x))];
      for (let x = 0; x < w; x++) { T[y * w + x] = acc / (2 * r + 1); acc += F[y * w + Math.min(w - 1, x + r + 1)] - F[y * w + Math.max(0, x - r)]; } }
    for (let x = 0; x < w; x++) { let acc = 0; for (let y = -r; y <= r; y++) acc += T[Math.min(h - 1, Math.max(0, y)) * w + x];
      for (let y = 0; y < h; y++) { O[y * w + x] = acc / (2 * r + 1); acc += T[Math.min(h - 1, y + r + 1) * w + x] - T[Math.max(0, y - r) * w + x]; } }
    return O;
  };
  H = blur(blur(H, 3), 3);                                           // rounded sticker edge
  const grain = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) grain[i] = rand();
  const G = blur(grain, 1);
  const toCanvas = (fn, W = w, Hh = h) => {
    const w = W, h = Hh;
    const o = document.createElement('canvas'); o.width = w; o.height = h;
    const ctx = o.getContext('2d'), img = ctx.createImageData(w, h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const i = y * w + x, v = fn(x, y, i); img.data.set([v[0], v[1], v[2], 255], i * 4); }
    ctx.putImageData(img, 0, 0); return o;
  };
  const at = (F, x, y) => F[Math.min(h - 1, Math.max(0, y)) * w + Math.min(w - 1, Math.max(0, x))];
  const normal = toCanvas((x, y) => {
    const hx = (at(H, x + 1, y) - at(H, x - 1, y)) * 2.2 + (at(G, x + 1, y) - at(G, x - 1, y)) * 0.08;
    const hy = (at(H, x, y + 1) - at(H, x, y - 1)) * 2.2 + (at(G, x, y + 1) - at(G, x, y - 1)) * 0.08;
    const l = Math.hypot(hx, hy, 1);
    return [(-hx / l * 0.5 + 0.5) * 255, (hy / l * 0.5 + 0.5) * 255, (1 / l * 0.5 + 0.5) * 255];
  });
  const rough = toCanvas((x, y, i) => { const v = 0.85 + 0.15 * (vnoise3(x * 0.018, y * 0.018, 3.3) - 0.5) + 0.05 * (G[i] - 0.5); return [0, v * 255, 0]; });
  const peel = toCanvas((x, y) => {                                 // small tile, repeated across the label
    const e = 1, f = (xx, yy) => fbm3(xx * 0.05, yy * 0.05, 9.1, 2);
    const hx = (f(x + e, y) - f(x - e, y)) * 3, hy = (f(x, y + e) - f(x, y - e)) * 3, l = Math.hypot(hx, hy, 1);
    return [(-hx / l * 0.5 + 0.5) * 255, (hy / l * 0.5 + 0.5) * 255, (1 / l * 0.5 + 0.5) * 255];
  }, 256, 256);
  const T = (cnv) => { const t = new THREE.CanvasTexture(cnv); t.colorSpace = THREE.NoColorSpace; t.anisotropy = 8; return t; };
  const peelT = T(peel); peelT.wrapS = peelT.wrapT = THREE.RepeatWrapping; peelT.repeat.set(2, 3);
  return { normal: T(normal), rough: T(rough), peel: peelT };
}

async function buildLabel(rect) {
  const SW = 293, SH = 427, K = 4;
  const img = new Image();
  const url = URL.createObjectURL(new Blob([LABEL_SVG], { type: 'image/svg+xml' }));
  img.src = url;
  try { await img.decode(); } catch (e) { console.warn('label svg failed to decode', e); return; }
  const c = document.createElement('canvas'); c.width = SW * K; c.height = SH * K;
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(url);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const sticker = stickerMaps(c);
  const mat = new THREE.MeshPhysicalMaterial({
    map: tex, transparent: true, depthWrite: false,
    roughness: 0.62, roughnessMap: sticker.rough,                    // matte printed paper/vinyl
    normalMap: sticker.normal, normalScale: new THREE.Vector2(0.6, 0.6),
    clearcoat: 1, clearcoatRoughness: 0.07,                          // glossy laminate on top: the reflection
    clearcoatNormalMap: sticker.peel, clearcoatNormalScale: new THREE.Vector2(0.05, 0.05),
    emissiveMap: tex, emissive: 0xffffff, emissiveIntensity: 0.1, envMapIntensity: 1.15,
  });
  // fit the SVG inside the model's label area ("palette"), keeping the artwork's proportions
  const rw = rect.max.x - rect.min.x, rh = rect.max.y - rect.min.y;
  const h = Math.min(rh, rw * SH / SW), w = h * SW / SH;
  const label = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  label.position.set((rect.min.x + rect.max.x) / 2, (rect.min.y + rect.max.y) / 2, rect.max.z + 0.003);
  bottle.add(label);
}

const inFoot = (p) => Math.abs(p.x) < FOOT.x && Math.abs(p.z) < FOOT.z;
const dummy = new THREE.Object3D(), tmpC = new THREE.Color(), sp = new THREE.Vector3(), sn = new THREE.Vector3();

{ // moss: thousands of lumpy little blobs oriented to the surface
  let tg = new THREE.IcosahedronGeometry(1, 2); tg.deleteAttribute('normal'); tg.deleteAttribute('uv'); tg = mergeVertices(tg);
  const tp = tg.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < tp.count; i++) { v.fromBufferAttribute(tp, i); v.multiplyScalar(0.72 + 0.56 * vnoise3(v.x * 2.6 + 3, v.y * 2.6, v.z * 2.6)); tp.setXYZ(i, v.x, v.y, v.z); }
  tg.computeVertexNormals();
  const N = MOBILE ? 600 : 1000;
  const mesh = new THREE.InstancedMesh(tg, texturize(new THREE.MeshPhysicalMaterial({ roughness: 1, sheen: 1, sheenRoughness: 0.5, sheenColor: new THREE.Color(0.55, 0.58, 0.22) }), { colorFreq: 3, colorAmt: 0.5, bumpFreq: 9, strength: 0.9, translucency: 0.35 }), N);
  let k = 0, guard = 0;
  while (k < N && guard++ < N * 20) {
    sampler.sample(sp, sn);
    if (sp.y < -0.55 || sp.y > -0.25 || inFoot(sp)) continue;
    const under = sp.y < -0.22;
    const s = rr(0.03, 0.085) * (under ? 0.8 : 1);
    dummy.position.copy(sp).addScaledVector(sn, -s * 0.25);
    dummy.quaternion.setFromUnitVectors(UP, sn); dummy.rotateY(rand() * 6.283);
    dummy.scale.set(s, s * rr(0.45, 0.75), s); dummy.updateMatrix();
    mesh.setMatrixAt(k, dummy.matrix);
    const r = rand();
    if (under) tmpC.setRGB(rr(0.08, 0.16), rr(0.07, 0.12), rr(0.03, 0.05));
    else if (r < 0.45) tmpC.setRGB(rr(0.07, 0.13), rr(0.09, 0.15), rr(0.02, 0.04));
    else if (r < 0.8) tmpC.setRGB(rr(0.17, 0.27), rr(0.17, 0.24), rr(0.04, 0.07));
    else tmpC.setRGB(rr(0.25, 0.34), rr(0.18, 0.23), rr(0.07, 0.1));
    mesh.setColorAt(k, tmpC); k++;
  }
  mesh.count = k; mesh.castShadow = true; mesh.receiveShadow = true;
  island.add(mesh); SCENE_REFS.mossBlobs = mesh.material;
}

{ // Shell-textured moss: the island skin is drawn LAYERS times, each copy pushed a little further out
  // along the normal. Every layer keeps only the fragments that sit inside a "strand" taller than that
  // layer, so the stack reads as a dense, velvety carpet of tiny tufts with a fuzzy silhouette.
  const LAYERS = MOBILE ? 14 : 24, HEIGHT = 0.055, DENSITY = 150;
  const pos = islandGeo.attributes.position, idx = islandGeo.index.array, keep = [];
  for (let i = 0; i < idx.length; i += 3) {
    const a = idx[i], b = idx[i + 1], c = idx[i + 2];
    if (pos.getY(a) > -0.78 && pos.getY(b) > -0.78 && pos.getY(c) > -0.78) keep.push(a, b, c);
  }
  const mask = new Float32Array(pos.count);
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const foot = smooth(0.0, 0.06, Math.max(Math.abs(x) - FOOT.x + 0.04, Math.abs(z) - FOOT.z + 0.04));
    mask[i] = smooth(-0.78, -0.3, y + 0.12 * (fbm3(x * 3, y * 3, z * 3, 2) - 0.5)) * foot;   // ragged lower edge
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', pos); g.setAttribute('normal', islandGeo.attributes.normal);
  g.setAttribute('aMask', new THREE.BufferAttribute(mask, 1)); g.setIndex(keep);
  const mat = new THREE.MeshStandardMaterial({ roughness: 0.95 });
  mat.customProgramCacheKey = () => 'mossShell' + LAYERS;
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = U.uTime; sh.uniforms.uMossTint = MOSS_TINT;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `#include <common>
        uniform float uTime; attribute float aMask; varying float vLayer; varying vec3 vBase; varying float vMask;
        ${NOISE_GLSL}`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        float layer = 0.03 + 0.97 * float(gl_InstanceID) / ${(LAYERS - 1).toFixed(1)};
        vLayer = layer; vBase = position; vMask = aMask;
        float hump = vn(position * 4.5 + 3.0) * 0.07 + vn(position * 12.0 + 7.0) * 0.025;   // hummocks
        transformed += objectNormal * (hump + layer * ${HEIGHT.toFixed(3)}) * aMask;
        vec2 wind = vec2(sin(uTime * 1.3 + position.x * 3.0 + position.z * 2.0), cos(uTime * 1.1 + position.z * 3.0 - position.x));
        transformed.xz += wind * 0.005 * layer * layer * aMask;`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
        varying float vLayer; varying vec3 vBase; varying float vMask; uniform vec3 uMossTint;
        ${NOISE_GLSL}`)
      .replace('#include <clipping_planes_fragment>', `#include <clipping_planes_fragment>
        vec3 q = mat3(0.80, 0.36, -0.48, -0.20, 0.91, 0.36, 0.56, -0.20, 0.80) * vBase * ${DENSITY.toFixed(1)};
        vec3 cell = floor(q);
        vec3 jit = vec3(nh(cell + 1.7), nh(cell + 3.1), nh(cell + 5.3)) - 0.5;
        vec3 off = fract(q) - 0.5 - jit * 0.45;
        float clump = vn(vBase * 9.0);

        float tip = clamp(vLayer / max(strandH, 1e-3), 0.0, 1.0);
        if (vLayer > 0.05 && (vLayer > strandH || length(off) > 0.62 * (1.0 - tip * 0.85))) discard;`)
      .replace('#include <color_fragment>', `#include <color_fragment>
        {
          vec3 dark = vec3(0.012, 0.022, 0.005), mid = vec3(0.07, 0.13, 0.02), lite = vec3(0.2, 0.3, 0.05);
          vec3 c = mix(dark, mid, smoothstep(0.0, 0.45, vLayer));
          c = mix(c, lite, pow(tip, 2.0) * nh(cell + 9.0) * 0.8);

          c = mix(c, c * vec3(1.35, 1.1, 0.6), smoothstep(0.6, 0.85, vn(vBase * 3.5)) * 0.4);    // olive patches
          c *= mix(0.4, 1.0, smoothstep(0.3, 0.62, vn(vBase * 26.0 + 4.0)));                      // dark speckle

          diffuseColor.rgb = c * uMossTint;

{ // grass: a tapered, leaning strip of 7 rows; instance scale = (width, height, height)
  const segs = 6, pos = [], idx = [];

class DreamEffect extends Effect {
  constructor(glowTexture) {
    super('DreamEffect', /* glsl */`
      uniform sampler2D mistMap, glowMap;
      uniform float exposure, mist, halation;
      uniform vec3 halColor;
      void mainImage(const in vec4 inputColor, const in vec2 uv, out vec4 outputColor) {
        float e = exp2(exposure);
        vec3 c = inputColor.rgb * e;
        // Pro-Mist: a wide, soft veil of the whole frame; highlights bleed most, shadows stay fairly clean
        vec3 m = texture2D(mistMap, uv).rgb * e;
        c = mix(c, m, mist * 0.32) + m * mist * 0.2 * smoothstep(0.15, 1.6, dot(m, vec3(0.2126, 0.7152, 0.0722)));
        // halation: light scattered back off the film base glows red-orange around bright edges

        outputColor = vec4(c, inputColor.a);

      blendFunction: BlendFunction.NORMAL,
      uniforms: new Map([['mistMap', new THREE.Uniform(null)], ['glowMap', new THREE.Uniform(glowTexture)], ['exposure', new THREE.Uniform(0)],

class FilmGradeEffect extends Effect {
  constructor() {
    super('FilmGradeEffect', GRADE_GLSL + /* glsl */`
      uniform float vig, grainAmt, grainSize, flicker, leak, bars, frameNo;
      uniform vec3 leakCol;
      float hash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
      void mainImage(const in vec4 inputColor, const in vec2 uv, out vec4 outputColor) {
        vec3 c = grade(clamp(inputColor.rgb, 0.0, 1.0));
        float fr = frameNo >= 0.0 ? frameNo : floor(time * 24.0);                  // film runs at 24 fps (film render: one grain per output frame)
        c *= 1.0 + flicker * 0.06 * (hash12(vec2(fr, 3.7)) - 0.5);
        // light leaks: two warm blooms drifting in from the frame edges, screen-blended
        vec2 p = (uv - 0.5) * vec2(aspect, 1.0);
        float ph = time * 0.11;
        vec2 q1 = vec2(-0.62 * aspect + 0.14 * sin(ph * 2.1), 0.46 + 0.1 * cos(ph * 1.7));
        vec2 q2 = vec2(0.66 * aspect + 0.1 * cos(ph * 1.3), -0.18 + 0.24 * sin(ph * 0.9));
        float pulse = 0.7 + 0.3 * sin(time * 0.43) * sin(time * 0.29 + 1.0);
        vec3 lk = leak * pulse * (leakCol * exp(-dot(p - q1, p - q1) * 2.6) + mix(leakCol, vec3(1.0, 0.3, 0.45), 0.55) * 0.7 * exp(-dot(p - q2, p - q2) * 4.0));
        c = 1.0 - (1.0 - c) * (1.0 - clamp(lk, 0.0, 1.0));

        float r = length(p) / length(vec2(0.5 * aspect, 0.5));
        c *= 1.0 - vig * smoothstep(0.3, 1.1, r);

        vec2 gp = floor(gl_FragCoord.xy / grainSize) + vec2(fr * 17.0, fr * 31.0);
        float n = hash12(gp) + hash12(gp + 71.3) - 1.0;
        vec3 nc = vec3(hash12(gp + 5.1), hash12(gp + 9.7), hash12(gp + 13.3)) - 0.5;
        float l = luma(pow(c, vec3(1.0 / 2.2)));
        float w = 1.0 - 0.7 * pow(abs(l * 2.0 - 1.0), 2.0);
        c = pow(max(pow(c, vec3(1.0 / 2.2)) + (n + nc * 0.35) * grainAmt * 0.11 * w, 0.0), vec3(2.2));

        if (bars > 0.0) { float hb = 0.5 - 0.5 * aspect / bars; float px = 1.0 / resolution.y;

        outputColor = vec4(c, inputColor.a);
      }`, {
      blendFunction: BlendFunction.NORMAL,
      uniforms: new Map([...['temp', 'tint', 'contrast', 'sat', 'vib', 'shadows', 'highlights', 'fade', 'soft', 'split', 'balance',
        'vig', 'grainAmt', 'grainSize', 'flicker', 'leak', 'bars'].map((k) => [k, new THREE.Uniform(0)]),
        ['frameNo', new THREE.Uniform(-1)], ['shCol', new THREE.Uniform(new THREE.Vector3())], ['hiCol', new THREE.Uniform(new THREE.Vector3())], ['leakCol', new THREE.Uniform(new THREE.Color())]]),
    });
  }
}

/* =====================================================================
   10. Frame loop
   ===================================================================== */
const clock = new THREE.Clock();
let t = 0, frame = 0, perfAcc = 0, perfN = 0;
let focusOverride = null;
function render() {
  const dt = Math.min(clock.getDelta(), 1 / 20);
  step(dt);
  if (sound) sound.update(dt);
  // adaptive quality: if the first few seconds run slower than ~40 fps on a high-DPI screen, drop to 1x pixels
  if (perfN >= 0 && frame > 30) {
    perfAcc += dt; perfN++;
    if (perfN === 90) { if (perfAcc / perfN > 1 / 40 && renderer.getPixelRatio() > 1) { renderer.setPixelRatio(1); resize(); } perfN = -1; }
  }
  if (frame === 3) {
    window.__revealScene?.();                              // shutter transition from the title card into the scene
    setTimeout(() => { const h = document.getElementById('hint'); if (h) h.style.opacity = '0'; }, 9000);
  }
  requestAnimationFrame(render);
}
// one simulation + render step with a fixed dt (used by both the realtime loop and film mode)
function step(dt) {
  t += dt; frame++;

  island.position.y = Math.sin(t * 0.55) * 0.07;
  island.rotation.z = Math.sin(t * 0.37) * 0.012;
  island.rotation.x = Math.cos(t * 0.43) * 0.01;

    s.o.rotation.z = Math.sin(t * s.f + s.ph) * s.amp + Math.sin(t * s.f * 2.3 + s.ph * 1.7) * s.amp * 0.3;

  if (window.__bubbles) window.__bubbles(dt, t);
  bloomer.update(t);
  butterflies.update(t);
  if (!FILM) controls.update();
  skyDome.position.copy(camera.position);
  if (focusOverride) dof.target.copy(focusOverride); else bottle.getWorldPosition(dof.target).y += 0.75;
  if (!GLASS.rt) sizeGlassRT();
  renderGlassBackFaces();
  composer.render(dt);

}

/* =====================================================================

/* =====================================================================
   12. Live sound (synthesised with Web Audio): subtle and untuned, no music. The film's voices, triggered by
   interaction, over a quiet wind bed; the slosh follows the liquid and a whoosh follows how fast you orbit.

   (top right) toggles it.

const sound = (() => {
  if (FILM) return null;
  let ctx = null, master = null, V = null, on = false, userOff = false, lastBloom = 0;

      b3 = 0.8665 * b3 + w * 0.3104856; b4 = 0.55 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.016898;

buildPlants();
const plantMerge = mergePlants();
resize();
const hdriReady = loadHDRI().catch((e) => console.warn('HDRI failed to load, keeping the procedural sky', e));
const ready = loadBottle().then(buildLabel).catch((e) => console.error('bottle failed to load', e));
if (FILM) Promise.all([ready, hdriReady]).then(() => film.warm()).then(() => { window.__film.state = 'ready'; });
else ready.finally(() => requestAnimationFrame(render));
window.__dbg = { scene, camera, renderer, controls, island, tone, dof, ao, bloom, composer, skyDome, ToneMappingMode, bloomer, U, SLOSH, bloomAt, sound, plantMerge, look, butterflies };
</script>
