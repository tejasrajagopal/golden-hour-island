<style>
  /* The scene is a daylight sky, so both themes share the same palette. */
  :root { --sky-top: #6f93cf; --sky-bottom: #b4c9e8; --bg: #8fb0de; --text: #ffffff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --sky-top: #6f93cf; --sky-bottom: #b4c9e8; --bg: #8fb0de; --text: #ffffff; } }
  :root[data-theme="dark"] { --sky-top: #6f93cf; --sky-bottom: #b4c9e8; --bg: #8fb0de; --text: #ffffff; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); }
  body { font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  canvas { display: block; outline: none; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #hint { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); pointer-events: none;
    font-size: 12px; letter-spacing: .03em; color: rgba(255,255,255,.8); text-shadow: 0 1px 8px rgba(40,70,120,.35);
    transition: opacity 1.2s; white-space: nowrap; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 5; transition: opacity 1s;
    background: linear-gradient(var(--sky-top), var(--sky-bottom)); color: var(--text); font-weight: 600; font-size: 18px; letter-spacing: .08em; }
  #err { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; z-index: 6;
    background: #8fb0de; color: #fff; font-size: 15px; }
</style>

//  - peel:   very gentle "orange peel" ripple of the laminate, so its reflection wobbles like a real sticker
function stickerMaps(src) {
  const S = 2, w = Math.round(src.width / S), h = Math.round(src.height / S);
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const g = cv.getContext('2d'); g.drawImage(src, 0, 0, w, h);

  let H = new Float32Array(w * h);

  };

  const grain = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) grain[i] = rand();
  const G = blur(grain, 1);

    const w = W, h = Hh;
    const o = document.createElement('canvas'); o.width = w; o.height = h;
    const ctx = o.getContext('2d'), img = ctx.createImageData(w, h);

async function buildLabel(rect) {
  const SW = 293, SH = 427, K = 4;
  const img = new Image();
  const url = URL.createObjectURL(new Blob([LABEL_SVG], { type: 'image/svg+xml' }));
  img.src = url;
  try { await img.decode(); } catch (e) { console.warn('label svg failed to decode', e); return; }
  const c = document.createElement('canvas'); c.width = SW * K; c.height = SH * K;
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(url);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const sticker = stickerMaps(c);
  const mat = new THREE.MeshPhysicalMaterial({
    map: tex, transparent: true, depthWrite: false,
    roughness: 0.62, roughnessMap: sticker.rough,                    // matte printed paper/vinyl
    normalMap: sticker.normal, normalScale: new THREE.Vector2(0.6, 0.6),
    clearcoat: 1, clearcoatRoughness: 0.07,                          // glossy laminate on top: the reflection
    clearcoatNormalMap: sticker.peel, clearcoatNormalScale: new THREE.Vector2(0.05, 0.05),
    emissiveMap: tex, emissive: 0xffffff, emissiveIntensity: 0.1, envMapIntensity: 1.15,
  });
  // fit the SVG inside the model's label area ("palette"), keeping the artwork's proportions
  const rw = rect.max.x - rect.min.x, rh = rect.max.y - rect.min.y;
  const h = Math.min(rh, rw * SH / SW), w = h * SW / SH;
  const label = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  label.position.set((rect.min.x + rect.max.x) / 2, (rect.min.y + rect.max.y) / 2, rect.max.z + 0.003);
  bottle.add(label);
}

const inFoot = (p) => Math.abs(p.x) < FOOT.x && Math.abs(p.z) < FOOT.z;
const dummy = new THREE.Object3D(), tmpC = new THREE.Color(), sp = new THREE.Vector3(), sn = new THREE.Vector3();

{ // moss: thousands of lumpy little blobs oriented to the surface
  let tg = new THREE.IcosahedronGeometry(1, 2); tg.deleteAttribute('normal'); tg.deleteAttribute('uv'); tg = mergeVertices(tg);
  const tp = tg.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < tp.count; i++) { v.fromBufferAttribute(tp, i); v.multiplyScalar(0.72 + 0.56 * vnoise3(v.x * 2.6 + 3, v.y * 2.6, v.z * 2.6)); tp.setXYZ(i, v.x, v.y, v.z); }
  tg.computeVertexNormals();
  const N = MOBILE ? 600 : 1000;
  const mesh = new THREE.InstancedMesh(tg, texturize(new THREE.MeshPhysicalMaterial({ roughness: 1, sheen: 1, sheenRoughness: 0.5, sheenColor: new THREE.Color(0.55, 0.58, 0.22) }), { colorFreq: 3, colorAmt: 0.5, bumpFreq: 9, strength: 0.9, translucency: 0.35 }), N);
  let k = 0, guard = 0;
  while (k < N && guard++ < N * 20) {
    sampler.sample(sp, sn);
    if (sp.y < -0.55 || sp.y > -0.25 || inFoot(sp)) continue;
    const under = sp.y < -0.22;
    const s = rr(0.03, 0.085) * (under ? 0.8 : 1);
    dummy.position.copy(sp).addScaledVector(sn, -s * 0.25);
    dummy.quaternion.setFromUnitVectors(UP, sn); dummy.rotateY(rand() * 6.283);
    dummy.scale.set(s, s * rr(0.45, 0.75), s); dummy.updateMatrix();
    mesh.setMatrixAt(k, dummy.matrix);
    const r = rand();
    if (under) tmpC.setRGB(rr(0.08, 0.16), rr(0.07, 0.12), rr(0.03, 0.05));
    else if (r < 0.45) tmpC.setRGB(rr(0.07, 0.13), rr(0.09, 0.15), rr(0.02, 0.04));
    else if (r < 0.8) tmpC.setRGB(rr(0.17, 0.27), rr(0.17, 0.24), rr(0.04, 0.07));
    else tmpC.setRGB(rr(0.25, 0.34), rr(0.18, 0.23), rr(0.07, 0.1));
    mesh.setColorAt(k, tmpC); k++;
  }
  mesh.count = k; mesh.castShadow = true; mesh.receiveShadow = true;

}

{ // Shell-textured moss: the island skin is drawn LAYERS times, each copy pushed a little further out
  // along the normal. Every layer keeps only the fragments that sit inside a "strand" taller than that
  // layer, so the stack reads as a dense, velvety carpet of tiny tufts with a fuzzy silhouette.
  const LAYERS = MOBILE ? 14 : 24, HEIGHT = 0.055, DENSITY = 150;
  const pos = islandGeo.attributes.position, idx = islandGeo.index.array, keep = [];
  for (let i = 0; i < idx.length; i += 3) {
    const a = idx[i], b = idx[i + 1], c = idx[i + 2];
    if (pos.getY(a) > -0.78 && pos.getY(b) > -0.78 && pos.getY(c) > -0.78) keep.push(a, b, c);
  }
  const mask = new Float32Array(pos.count);
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const foot = smooth(0.0, 0.06, Math.max(Math.abs(x) - FOOT.x + 0.04, Math.abs(z) - FOOT.z + 0.04));
    mask[i] = smooth(-0.78, -0.3, y + 0.12 * (fbm3(x * 3, y * 3, z * 3, 2) - 0.5)) * foot;   // ragged lower edge
  }

  g.setAttribute('position', pos); g.setAttribute('normal', islandGeo.attributes.normal);
  g.setAttribute('aMask', new THREE.BufferAttribute(mask, 1)); g.setIndex(keep);
  const mat = new THREE.MeshStandardMaterial({ roughness: 0.95 });
  mat.customProgramCacheKey = () => 'mossShell' + LAYERS;
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = U.uTime;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `#include <common>
        uniform float uTime; attribute float aMask; varying float vLayer; varying vec3 vBase; varying float vMask;
        ${NOISE_GLSL}`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        float layer = 0.03 + 0.97 * float(gl_InstanceID) / ${(LAYERS - 1).toFixed(1)};
        vLayer = layer; vBase = position; vMask = aMask;
        float hump = vn(position * 4.5 + 3.0) * 0.07 + vn(position * 12.0 + 7.0) * 0.025;   // hummocks
        transformed += objectNormal * (hump + layer * ${HEIGHT.toFixed(3)}) * aMask;
        vec2 wind = vec2(sin(uTime * 1.3 + position.x * 3.0 + position.z * 2.0), cos(uTime * 1.1 + position.z * 3.0 - position.x));

        vec3 q = mat3(0.80, 0.36, -0.48, -0.20, 0.91, 0.36, 0.56, -0.20, 0.80) * vBase * ${DENSITY.toFixed(1)};
        vec3 cell = floor(q);

        vec3 off = fract(q) - 0.5 - jit * 0.45;
        float clump = vn(vBase * 9.0);

        {
          vec3 dark = vec3(0.012, 0.022, 0.005), mid = vec3(0.07, 0.13, 0.02), lite = vec3(0.2, 0.3, 0.05);

  const bit = V3().crossVectors(n, tan);
  const count = burst ? 5 : 1 + (rand() < 0.4 ? 1 : 0);
  for (let k = 0; k < count; k++) {
    const a = rand() * 6.283, d = k === 0 && !burst ? 0 : rr(0.02, burst ? 0.12 : 0.05);
    const p = lp.clone().addScaledVector(tan, Math.cos(a) * d).addScaledVector(bit, Math.sin(a) * d);
    bloomer.spawn(p, n, U.uTime.value + k * 0.08);
  }
  return 'moss';
}
renderer.domElement.addEventListener('pointermove', (ev) => {
  const now = performance.now();
  if (ev.buttons || now - pointer.last < 45) { pointer.px = ev.clientX; return; }
  pointer.last = now;
  const what = bloomAt(ev.clientX, ev.clientY, false);
  if (what === 'bottle') SLOSH.v.x += THREE.MathUtils.clamp((ev.clientX - pointer.px) * 0.004, -0.15, 0.15);
  renderer.domElement.style.cursor = what ? 'pointer' : '';
  pointer.px = ev.clientX;
});
renderer.domElement.addEventListener('pointerdown', (ev) => { pointer.down = [ev.clientX, ev.clientY, performance.now()]; });
renderer.domElement.addEventListener('pointerup', (ev) => {
  const d = pointer.down; pointer.down = null;
  if (!d || Math.hypot(ev.clientX - d[0], ev.clientY - d[1]) > 6 || performance.now() - d[2] > 400) return;   // was a drag
  if (bloomAt(ev.clientX, ev.clientY, true) === 'bottle') { SLOSH.v.x += rr(-0.35, 0.35); SLOSH.v.y += rr(-0.25, 0.25); }
});

/* =====================================================================
   8. Clouds (billboarded puffs in a ring below the island) + drifting pollen
   ===================================================================== */
{
  seed = 77;
  const puffs = [];
  for (let c = 0; c < 18; c++) {
    const ang = c < 8 ? rr(-Math.PI * 0.9, -Math.PI * 0.1) : rand() * 6.283;
    const R = rr(22, 44), cx = Math.cos(ang) * R, cz = Math.sin(ang) * R, cy = rr(-9, -5.5), w = rr(5, 11);
    const n = 10 + (rand() * 10 | 0);
    for (let i = 0; i < n; i++) {
      const a = rand() * 6.283, rad = Math.sqrt(rand());
      puffs.push(cx + Math.cos(a) * rad * w, cy + rr(0, 1.8) * (1 - rad * 0.5), cz + Math.sin(a) * rad * w * 0.5, rr(2.2, 4.4) * (1.15 - rad * 0.4), rand() * 40);
    }
  }
  const n = puffs.length / 5;
  const geo = new THREE.InstancedBufferGeometry().copy(new THREE.PlaneGeometry(1, 1));
  geo.instanceCount = n;
  const aC = new Float32Array(n * 3), aS = new Float32Array(n * 2);
  for (let i = 0; i < n; i++) { aC.set(puffs.slice(i * 5, i * 5 + 3), i * 3); aS.set(puffs.slice(i * 5 + 3, i * 5 + 5), i * 2); }
  geo.setAttribute('aC', new THREE.InstancedBufferAttribute(aC, 3));
  geo.setAttribute('aS', new THREE.InstancedBufferAttribute(aS, 2));
  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: U.uTime, uSun: { value: SUN }, uLit: { value: new THREE.Color('#fff8ee').multiplyScalar(1.1) }, uShade: { value: new THREE.Color('#b4c2dc') }, uHaze: { value: new THREE.Color('#b9cce8') } },
    transparent: true, depthWrite: false, premultipliedAlpha: true,
    vertexShader: /* glsl */`
      attribute vec3 aC; attribute vec2 aS; uniform float uTime; varying vec2 vUv; varying float vSeed; varying float vFog;
      varying vec3 vR; varying vec3 vU; varying vec3 vF;
      void main(){
        vec3 c = aC + vec3(sin(uTime * 0.03 + aS.y) * 0.6, 0.0, 0.0);
        vec3 right = vec3(viewMatrix[0][0], viewMatrix[1][0], viewMatrix[2][0]);
        vec3 up = vec3(viewMatrix[0][1], viewMatrix[1][1], viewMatrix[2][1]);
        vec3 w = c + (right * position.x + up * position.y * 0.72) * aS.x * 2.0;
        vUv = uv; vSeed = aS.y; vFog = smoothstep(25.0, 60.0, length(c - cameraPosition));
        vR = right; vU = up; vF = normalize(cameraPosition - c);
        gl_Position = projectionMatrix * viewMatrix * vec4(w, 1.0);
      }`,
    fragmentShader: /* glsl */`
      uniform float uTime; uniform vec3 uSun, uLit, uShade, uHaze; varying vec2 vUv; varying float vSeed; varying float vFog;
      varying vec3 vR; varying vec3 vU; varying vec3 vF;
      float h2(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float n2(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
        return mix(mix(h2(i), h2(i+vec2(1,0)), f.x), mix(h2(i+vec2(0,1)), h2(i+vec2(1,1)), f.x), f.y); }
      float fbm2(vec2 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 5; i++){ s += a * n2(p); p = p * 2.02 + 5.3; a *= 0.5; } return s; }
      void main(){
        vec2 p = vUv * 2.0 - 1.0;
        float n = fbm2(vUv * 3.0 + vSeed + uTime * 0.01), m = fbm2(vUv * 7.0 - vSeed);
        float r = length(p * vec2(1.0, 1.2)) + (n - 0.5) * 0.6 + (m - 0.5) * 0.22;
        float dens = 1.0 - smoothstep(0.5, 0.74, r);
        if (dens < 0.01) discard;
        float z = sqrt(max(0.0, 1.0 - min(r * r, 1.0)));
        vec3 nW = normalize(vR * p.x + vU * p.y * 1.2 + vF * z);
        float sunL = dot(nW, uSun) * 0.5 + 0.5;
        float lit = smoothstep(0.05, 0.9, sunL * 0.3 + (p.y * 0.5 + 0.5) * 0.7 + (n - 0.5) * 0.35);
        vec3 col = mix(uShade, uLit, lit);
        col += vec3(1.0, 0.9, 0.75) * (1.0 - z) * pow(max(dot(-vF, uSun), 0.0), 3.0) * 0.5;
        col = mix(col, uHaze, vFog * 0.65);
        float a = dens * 0.92;
        gl_FragColor = vec4(col * a, a);
      }`,
  });
  const clouds = new THREE.Mesh(geo, mat); clouds.frustumCulled = false; clouds.renderOrder = 5;
  scene.add(clouds);
}
const motes = (() => {
  seed = 99;
  const N = 36, pos = new Float32Array(N * 3), sd = new Float32Array(N);
  for (let i = 0; i < N; i++) { pos.set([rr(-2, 2), rr(-1.5, 3), rr(-1.6, 1.6)], i * 3); sd[i] = rand(); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('aSeed', new THREE.BufferAttribute(sd, 1));
  const m = new THREE.ShaderMaterial({
    uniforms: { uTime: U.uTime, uPx: { value: 1 } }, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: `attribute float aSeed; uniform float uTime; uniform float uPx; varying float vA;
      void main(){ vec3 p = position; float t = uTime * (0.05 + aSeed * 0.05);
        p.y = -1.5 + mod(p.y + 1.5 + t, 4.5); p.x += sin(uTime * 0.3 + aSeed * 20.0) * 0.15; p.z += cos(uTime * 0.25 + aSeed * 13.0) * 0.15;
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        vA = (0.3 + 0.7 * fract(aSeed * 7.13)) * smoothstep(-1.5, -1.0, p.y) * smoothstep(3.0, 2.4, p.y);
        gl_PointSize = uPx * (0.01 + 0.012 * aSeed) / -mv.z; gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `varying float vA; void main(){ vec2 c = gl_PointCoord * 2.0 - 1.0; float r = dot(c, c); if (r > 1.0) discard; gl_FragColor = vec4(vec3(1.0, 0.86, 0.6) * (1.0 - r) * vA * 0.45, 1.0); }`,
  });
  const p = new THREE.Points(g, m); p.frustumCulled = false; island.add(p);
  return m;
})();

/* =====================================================================
   9. Post-processing (pmndrs/postprocessing): N8AO ambient occlusion, depth of field, bloom, AgX, vignette, grain
   ===================================================================== */
const composer = new EffectComposer(renderer, { frameBufferType: THREE.HalfFloatType, multisampling: MOBILE ? 0 : 4 });
composer.addPass(new RenderPass(scene, camera));
const ao = new N8AOPostPass(scene, camera, innerWidth, innerHeight);
Object.assign(ao.configuration, {
  aoRadius: 0.32, distanceFalloff: 1.0, intensity: 2.6, aoSamples: MOBILE ? 8 : 16, denoiseSamples: 8, denoiseRadius: 8,
  halfRes: MOBILE, gammaCorrection: false, color: new THREE.Color(0.06, 0.045, 0.02),
});
composer.addPass(ao);
const dof = new DepthOfFieldEffect(camera, { worldFocusRange: 5.5, bokehScale: MOBILE ? 1.6 : 2.4, resolutionScale: 0.75 });
dof.target = new THREE.Vector3();
composer.addPass(new EffectPass(camera, dof));
const bloom = new BloomEffect({ mipmapBlur: true, luminanceThreshold: 0.85, luminanceSmoothing: 0.25, intensity: 0.5, radius: 0.7 });
const tone = new ToneMappingEffect({ mode: ToneMappingMode.NEUTRAL });
const vignette = new VignetteEffect({ offset: 0.32, darkness: 0.42 });
const grain = new NoiseEffect({ premultiply: true }); grain.blendMode.opacity.value = 0.18;
composer.addPass(new EffectPass(camera, bloom, tone, vignette, grain));

function resize() {
  if (typeof sizeGlassRT === 'function') queueMicrotask(sizeGlassRT);
  const w = innerWidth, h = innerHeight, pr = renderer.getPixelRatio();
  renderer.setSize(w, h); composer.setSize(w, h);
  frameCamera(false);
  motes.uniforms.uPx.value = h * pr / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
}
addEventListener('resize', resize);

/* =====================================================================
   10. Frame loop
   ===================================================================== */
const clock = new THREE.Clock();
let t = 0, frame = 0, perfAcc = 0, perfN = 0;
function render() {
  const dt = Math.min(clock.getDelta(), 1 / 20);
  t += dt; frame++;
  // adaptive quality: if the first few seconds run slower than ~40 fps on a high-DPI screen, drop to 1x pixels
  if (perfN >= 0 && frame > 30) {
    perfAcc += dt; perfN++;
    if (perfN === 90) { if (perfAcc / perfN > 1 / 40 && renderer.getPixelRatio() > 1) { renderer.setPixelRatio(1); resize(); } perfN = -1; }
  }
  U.uTime.value = t;
  island.position.y = Math.sin(t * 0.55) * 0.07;
  island.rotation.z = Math.sin(t * 0.37) * 0.012;
  island.rotation.x = Math.cos(t * 0.43) * 0.01;
  for (const s of swayers) {
    s.o.rotation.z = Math.sin(t * s.f + s.ph) * s.amp + Math.sin(t * s.f * 2.3 + s.ph * 1.7) * s.amp * 0.3;
    s.o.rotation.x = Math.cos(t * s.f * 0.8 + s.ph) * s.amp * 0.6;
  }
  updateSlosh(dt);
  if (window.__bubbles) window.__bubbles(dt, t);
  bloomer.update(t);
  controls.update();
  skyDome.position.copy(camera.position);
  bottle.getWorldPosition(dof.target).y += 0.75;
  if (!GLASS.rt) sizeGlassRT();
  renderGlassBackFaces();
  composer.render(dt);
  if (frame === 3) {
    const l = document.getElementById('loading'); if (l) { l.style.opacity = '0'; setTimeout(() => l.remove(), 1100); }
    setTimeout(() => { document.getElementById('hint').style.opacity = '0'; }, 9000);
  }
  requestAnimationFrame(render);
}

buildPlants();
resize();
loadHDRI().catch((e) => console.warn('HDRI failed to load, keeping the procedural sky', e));
loadBottle().then(buildLabel).catch((e) => console.error('bottle failed to load', e)).finally(() => requestAnimationFrame(render));
window.__dbg = { scene, camera, renderer, controls, island, tone, dof, ao, bloom, composer, skyDome, ToneMappingMode, bloomer, U, SLOSH, bloomAt };
</script>
